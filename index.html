<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  
  <meta charset="UTF-8">
  <title>KLAYON</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .center-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1; /* Adjust as needed depending on orbit items */
      pointer-events: none; /* So buttons orbiting can still be clicked */
      opacity:0.7
    }

    .center-logo img {
      width: 50vmin;
      height: auto;
      opacity: 1;
    }



    body {
      margin: 0;
      padding: 0;
      font-family: 'Pixelify Sans', sans-serif;
      background-color: #f5f5f5;
      color: #0c0c0c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
    }

    img {
      max-width: 400px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .wireframe-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px; /* creates space between Join button and thumbnail */
    }

    .wireframe-thumb {
      width: 300px;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .wireframe-thumb:hover {
      transform: scale(1.03);
    }

    button {
      padding: 4px 10px;
      background-color: transparent;
      border: none;
      color: #000000;
      font-weight: bold;
      font-size: 1.5em;
      cursor: pointer;
      border-radius: 8px; /* ← adds smooth curves */
      font-family: 'Silkscreen', sans-serif;
    }
    button:hover {
      background-color: transparent;
      border: 1px dashed #0c0c0c;
    }
    /* button:hover {
      background-color: #9774dd;
    } */
    .lookbook-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lookbook-thumb {
      width: 300px;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
      margin-bottom: 12px;
    }

    .lookbook-thumb:hover {
      transform: scale(1.03);
    }
    .background-logo {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -40%);
      z-index: 1;
      opacity: 1;
      pointer-events: none;
      width: 150vmin; 
      aspect-ratio: 1/1;
      background-image: url('logo_loop.gif');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
    }

    #project-orbit-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none; /* we will turn on/off per unit */
    }

    .project-orbit {
      --radius: 160px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform:
        rotate(var(--angle, 0deg))
        translate(var(--radius))
        rotate(calc(var(--angle, 0deg) * -1)); /* keep upright */
      transform-origin: center;
      transition: transform 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
    }

    .project-orbit img {
      width: 120px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .project-orbit button {
      font-family: 'Pixelify Sans', system-ui;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s ease;
    }

    .project-orbit:hover img {
      transform: scale(1.08);
    }

    .project-unit {
      position: absolute;
      top: var(--y);
      left: var(--x);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }



    /* This keeps the button fixed in place */
    .project-unit .project-btn {
      z-index: 1;
    }

    /* The preview floats below the button and is hidden by default */
    .project-unit .preview {
      position: absolute;
      top: 100%; /* places it just below the button */
      left: 50%;
      transform: translateX(-50%) translateY(-12px); /* slide upward initially */
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    /* When active, fade and slide down into place */
    .project-unit.active .preview {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* Preview image styling */
    .project-unit .preview img {
      width: 20vmin;
      max-width: 90vw;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease;
    }
    .orbit-center {
      position: fixed;
      top: var(--cy);
      left: var(--cx);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 3;
    }

    .project-unit.orbiting {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(var(--start-angle, 0deg)) translateX(var(--radius, 100px)) rotate(calc(-1 * var(--start-angle, 0deg)));
      transform-origin: center;
      animation: orbit-spin 20s linear infinite;
    }

    @keyframes orbit-spin {
      from {
        transform: rotate(var(--start-angle, 0deg)) translateX(var(--radius, 100px)) rotate(calc(-1 * var(--start-angle, 0deg)));
      }
      to {
        transform: rotate(calc(var(--start-angle, 0deg) + 360deg)) translateX(var(--radius, 100px)) rotate(calc(-1 * (var(--start-angle, 0deg) + 360deg)));
      }
    }



  </style>
</head>

<header class="center-logo">
  <img class="logo-text" src="Full_logo.png" alt="Klayon Studio logo">
</header>

<script>

<script>
  const lookbookImages = [
    "Kikentai/Basuquiat1.JPEG",
    "Kikentai/Basuquiat2.JPEG",
    "Kikentai/Basuquiat3.JPEG",
    "Kikentai/Basuquiat4.JPEG",
    "Kikentai/skullhoodie1.JPEG",
    "Kikentai/skullhoodie2.JPEG",
    "Kikentai/skullhoodie3.JPEG",
    "Kikentai/skullhoodie4.JPEG",
    "Kikentai/Wristband1.JPG",
    "Kikentai/Wristband2.JPG",
    "Kikentai/Wristband3.JPG"
  ];
  let currentIndex = 0;
  const lookbookThumb = document.getElementById('lookbook-thumb');

  setInterval(() => {
    currentIndex = (currentIndex + 1) % lookbookImages.length;
    lookbookThumb.src = lookbookImages[currentIndex];
  }, 500); // change every 1
</script>

<script>
  const previewTimers = new Map();

  document.querySelectorAll('.project-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const unit = btn.closest('.project-unit');
      const preview = unit.querySelector('.preview');
      const img = preview.querySelector('img'); // might be null (Portal)

      // If this unit is already active, toggle it off
      const isActive = unit.classList.contains('active');
      if (isActive) {
        unit.classList.remove('active');
        if (previewTimers.has(unit)) {
          clearInterval(previewTimers.get(unit));
          previewTimers.delete(unit);
        }
        return;
      }

      // Otherwise, activate this unit
      unit.classList.add('active');

      if (img) {
        const imgList = img.dataset.srcs?.split(',').map(s => s.trim()) || [img.src];
        let cycleIndex = 0;

        // Reset and start image cycling
        if (previewTimers.has(unit)) {
          clearInterval(previewTimers.get(unit));
          previewTimers.delete(unit);
        }

        if (imgList.length > 1) {
          const timerId = setInterval(() => {
            cycleIndex = (cycleIndex + 1) % imgList.length;
            img.src = imgList[cycleIndex];
          }, 1500); // 1.5 sec per image
          previewTimers.set(unit, timerId);
        }

        // Auto-close after 5 seconds
        setTimeout(() => {
          if (unit.classList.contains('active')) {
            unit.classList.remove('active');
            if (previewTimers.has(unit)) {
              clearInterval(previewTimers.get(unit));
              previewTimers.delete(unit);
            }
          }
        }, 4000);
      }
    });
  });

  // Handle clicks on preview images and outside
  document.addEventListener('click', e => {
    // Clicking a preview image opens its link
    const img = e.target.closest('.preview img');
    if (img) {
      const unit = img.closest('.project-unit');
      const url = unit?.dataset?.link;
      if (url) window.open(url, '_blank');
    }

    // Clicking outside closes all previews
    if (!e.target.closest('.project-unit')) {
      document.querySelectorAll('.project-unit').forEach(unit => {
        unit.classList.remove('active');
        if (previewTimers.has(unit)) {
          clearInterval(previewTimers.get(unit));
          previewTimers.delete(unit);
        }
      });
    }
  });
</script>



<script>
function checkPortalCode() {
  const input = document.getElementById("portal-code").value;
  const secret = "Zmfodyd0"; // change this to your actual code

  if (input === secret) {
    const portalUnit = document.getElementById("portal-unit");
    const url = portalUnit.getAttribute("data-link");
    window.open(url, "_blank");
  } else {
    alert("Invalid code. Please try again.");
  }
}
</script>
